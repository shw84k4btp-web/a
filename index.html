<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: iPhone のノッチ・セーフエリアまで描画してアプリらしく見せる。
         user-scalable=no はアクセシビリティ上の問題があるため使わない
         (入力フォーカス時の自動ズームはフォント16pxで抑止済み) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="現在地から最寄りのトイレを検索し、徒歩ルートを案内するアプリ" />
    <meta name="theme-color" content="#1e40af" />
    <!-- iOS ホーム画面アプリ (standalone) 用設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="トイレ" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>トイレファインダー 🚻</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
